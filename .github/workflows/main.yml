name: Build Double‑Click EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      # Apply the double‑click patch (using the separate script)
      - name: Apply patch for double‑click mode
        run: python patch.py

      # Build the executable
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile `
            --name BruteForceAI `
            --add-data "$env:USERPROFILE\AppData\Local\ms-playwright;playwright\browsers" `
            --add-data "$env:pythonLocation\Lib\site-packages\playwright\driver;playwright\driver" `
            --hidden-import playwright `
            --hidden-import playwright.async_api `
            --hidden-import playwright.sync_api `
            --collect-all playwright `
            BruteForceAI.py

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BruteForceAI-DoubleClick
          path: dist\BruteForceAI.exe
          retention-days: 30
